{% extends "layout.html" %}

{% block title %}
    Drive Details
{% endblock %}

{% block content %}
    <h1 class="display-4 text-center">Create New Drive</h1>
    <form action="" method="post">
        <div class="form-group">
            <label for="title" class="form-label">Drive Title:</label>
            <input type="text" class="form-control" name="title" id="" required>
        </div>
        <div class="form-group">
            <label for="job_role" class="form-label">Job Role:</label>
            <input type="text" class="form-control" name="job_role" id="" required>
        </div>
        <div class="form-group">
            <label for="description" class="form-label">Job Description:</label>
            <textarea class="form-control" name="description" id="" required></textarea>
        </div>
        <div class="form-group">
            <label for="vacancies" class="form-label">Number of Vacancies:</label>
            <input type="number" class="form-control" name="vacancies" id="" required>  
        </div>
        <div class="form-group">
            <label for="last_date" class="form-label">Last Date to Apply:</label>
            <input type="date" class="form-control" name="last_date" id="" required>    
        </div>
        <div class="form-group">
            <label for="salary" class="form-label">Salary:</label>
            <input type="text" class="form-control" name="salary" id="" required>    
        </div>
        <div class="form-group">
            <label for="location" class="form-label">Location:</label>
            <input type="text" class="form-control" name="location" id="" required>    
        </div>
        <input type="submit" value="Create Drive" class="btn btn-primary mt-3">
    </form>
{% endblock %}
