{% extends "layout.html" %}

{% block title %}
    Edit Profile
{% endblock %}

{% block content %}
    <h1 class="display-4">Edit Profile</h1>
    <form action="" method="Post">
        <div class="form-group">
            <label for="username" class="form-label">Username:</label>
            <input type="text" class="form-control" name="username" id="" value="{{ user.username }}" required>
        </div>
        <div class="form-group">
            <label for="password" class="form-label">Current Password:</label>
            <input type="password" class="form-control" name="password" id="" required>
        </div>
        <div class="form-group">
            <label for="new_password" class="form-label">New Password:</label>
            <input type="password" class="form-control" name="new_password" id="" required>
        </div>
        <div class="form-group">
            <input type="submit" value="Update Profile" class="btn btn-primary mt-3">
        </div>
    </form>
{% endblock %}
