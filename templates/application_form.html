{% extends "layout.html" %}

{% block title %}
    Candidate Dashboard
{% endblock %}

{% block content %}
    <h1 class="display-4 text-center">Application Form for {{ drive.name }}</h1>

    <form action="" method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label for="name" class="form-label">Full Name:</label>
            <input type="text" class="form-control" name="name" id="" required>
        </div>
        <div class="form-group">
            <label for="department" class="form-label">Department:</label>
            <input type="text" class="form-control" name="department" id="" required>
        </div>
        <div class="form-group">
            <label for="resume" class="form-label">Upload Resume:</label>
            <input type="file" accept=".pdf,.doc,.docx" class="form-control" name="resume" id="" required>
        </div>
        <button type="submit" class="btn btn-primary mt-3">Submit Application</button>
    </form>
  

{% endblock %}
