{% extends "layout.html" %}

{% block title %}
    Update Drive 
{% endblock %}

{% block content %}
    <h1 class="display-4 text-center">Update Drive Details</h1>
    <form action="" method="post">
        <div class="form-group">
            <label for="title" class="form-label">Drive Title:</label>
            <input type="text" class="form-control" name="title" id="" value="{{ drive.title }}" required>
        </div>
        <div class="form-group">
            <label for="job_role" class="form-label">Job Role:</label>
            <input type="text" class="form-control" name="job_role" id="" value="{{ drive.job_role }}" required>
        </div>
        <div class="form-group">
            <label for="description" class="form-label">Job Description:</label>
            <textarea class="form-control" name="description" id="" required>{{ drive.description }}</textarea>
        </div>
        <div class="form-group">
            <label for="vacancies" class="form-label">Number of Vacancies:</label>
            <input type="number" class="form-control" name="vacancies" id="" value="{{ drive.vacancies }}" required>  
        </div>
        <div class="form-group">
            <label for="last_date" class="form-label">Last Date to Apply:</label>
            <input type="date" class="form-control" name="last_date" id="" value="{{ drive.last_date }}" required>    
        </div>
        <input type="submit" value="Update Drive" class="btn btn-primary mt-3">
    </form>
{% endblock %}
